services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: provenant
      POSTGRES_PASSWORD: provenant
      POSTGRES_DB: provenant
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/db-init.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U provenant"]
      interval: 5s
volumes:
  pgdata:
